name: ds_easy_db_firestore
description: "Cloud Firestore implementation for DS-EasyDB. Provides cloud-hosted NoSQL database with offline support and real-time synchronization."
version: 1.1.0
homepage: https://github.com/Dragon-InterActive/ds_easy_db_firestore
license: BSD-3-Clause

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.44.9'

dependencies:
  flutter:
    sdk: flutter
  ds_easy_db: ^1.1.1
  ds_sync_contract: ^0.1.0
  firebase_core: ^5.2.0
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

